[package]
name = "dgi"
version = "0.1.0"
description = "DGI desktop application"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dgi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rbx_binary = "3"
rbx_dom_weak = "4.2"
rbx_xml = "3"
lz4_flex = "0.13"
zstd = "0.13"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "dds"] }
rusqlite = { version = "0.43", features = ["bundled"] }
draco-core = { version = "2.3.2", default-features = false, features = ["decoder", "legacy_bitstream_decode", "edgebreaker_valence_decode"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-window-controls = "0.2.1"
winreg = "0.56"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
